<div class="container animated fadeIn fast ps-4 pt-4 pe-4">

  @for (group of groups; track group.key) {
    <h4 class="title-color" [class.mt-4]="!$first">{{ 'SKILLS.' + group.key | translate }}</h4>
    <div style="border-bottom: solid 2px #4D8088;"></div>

    <div class="row mt-2" [class.mb-4]="$last">
      @for (column of group.columns; track $index) {
        <div class="col-sm-12 col-lg-6">
          <div class="row">
            <div class="col col-sm-6 col-lg-6">
              @for (skill of column; track skill.name) {
                <p>{{ skill.name }}</p>
              }
            </div>

            <div class="col col-sm-6 col-lg-6">
              @for (skill of column; track skill.name) {
                <div class="progress" [class.mt-1]="$first" [class.mt-3]="!$first">
                  <div class="progress-bar" role="progressbar" [style.width.%]="skill.level"
                    [attr.aria-valuenow]="skill.level" aria-valuemin="0" aria-valuemax="100"></div>
                </div>
              }
            </div>
          </div>
        </div>
      }
    </div>
  }

</div>
